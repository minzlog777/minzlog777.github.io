  <script>
  (() => {
    const image = document.getElementById('originalDesignImage');
    const fallback = document.getElementById('missingImage');
    const full = document.getElementById('originalSizeLink');
    const motion = document.getElementById('busanNightMotion');
    const motionAsset = document.getElementById('busanNightMotionAsset');
    function failed(){
      image.hidden = true;
      fallback.hidden = false;
      full.hidden = true;
      motion.hidden = true;
    }
    // When the animation file is missing, keep the Figma full-page image visible.
    motionAsset.addEventListener('error', () => { motion.hidden = true; });
    if (motionAsset.complete && motionAsset.naturalWidth === 0) motion.hidden = true;
    image.addEventListener('error', failed);
    if (image.complete && image.naturalWidth === 0) failed();
    const indicator = document.getElementById('readingProgress');
    let ticking = false;
    function update(){
      const max = document.documentElement.scrollHeight - window.innerHeight;
      indicator.style.width = `${max > 0 ? Math.min(100, window.scrollY / max * 100) : 0}%`;
      ticking = false;
    }
    window.addEventListener('scroll', () => {
      if (!ticking) { ticking = true; requestAnimationFrame(update); }
    }, {passive:true});
    window.addEventListener('resize', update);
    update();
  })();
  </script>
